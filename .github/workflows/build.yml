name: TinPlayer Final Fix

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    permissions:
      contents: write
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode 16
        run: sudo xcode-select -s /Applications/Xcode_16.4.app

      - name: Build and Package
        run: |
          set -e
          
          echo "🚀 Preparing project structure..."
          # 获取原始文件夹名
          ORIGINAL_FOLDER=$(basename $(pwd))
          
          # 使用 trap 确保无论脚本成功还是失败，都会还原目录名，防止 Actions 后续步骤找不到目录
          trap 'cd "$GITHUB_WORKSPACE/.."; mv NewPlayer.swiftpm "$ORIGINAL_FOLDER" 2>/dev/null || true' EXIT
          
          # 重命名为 .swiftpm 以触发正确的构建逻辑
          cd ..
          mv "$ORIGINAL_FOLDER" NewPlayer.swiftpm
          cd NewPlayer.swiftpm
          
          rm -rf Payload NewPlayer.ipa NewPlayer.xcarchive DerivedData
          
          echo "🚀 Building NewPlayer.swiftpm..."
          /Applications/Xcode_16.4.app/Contents/Developer/usr/bin/xcodebuild archive \
            -scheme "NewPlayer" \
            -destination "generic/platform=iOS" \
            -archivePath ./NewPlayer.xcarchive \
            -derivedDataPath ./DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            SKIP_INSTALL=NO
          
          echo "📦 Assembling Bundle..."
          # 直接寻找并提取 Xcode 已经完整组装好的 .app 包
          APP_BUNDLE=$(find ./DerivedData -name "NewPlayer.app" -type d | grep "InstallationBuildProductsLocation" | head -n 1)
          
          if [ -n "$APP_BUNDLE" ]; then
            echo "✅ Found Compiled App Bundle: $APP_BUNDLE"
            mkdir -p Payload
            cp -R "$APP_BUNDLE" Payload/
          else
            echo "⚠️ Compiled bundle not found in DerivedData, checking xcarchive..."
            APP_BUNDLE="./NewPlayer.xcarchive/Products/Applications/NewPlayer.app"
            if [ -d "$APP_BUNDLE" ]; then
                echo "✅ Found in xcarchive: $APP_BUNDLE"
                mkdir -p Payload
                cp -R "$APP_BUNDLE" Payload/
            else
                echo "❌ ERROR: Cannot find NewPlayer.app anywhere!"
                find . -name "*.app" -type d
                exit 1
            fi
          fi
          
          echo "📝 Modifying Info.plist..."
          INFO_PLIST="Payload/NewPlayer.app/Info.plist"
          plutil -replace CFBundleIdentifier -string "com.skeuo.newplayer" "$INFO_PLIST"
          plutil -replace CFBundleDisplayName -string "New Player" "$INFO_PLIST"
          plutil -replace CFBundleName -string "NewPlayer" "$INFO_PLIST"
          plutil -replace UIBackgroundModes -json '["audio"]' "$INFO_PLIST"
          plutil -replace NSPhotoLibraryUsageDescription -string "我们需要访问相册以保存或读取封面图片。" "$INFO_PLIST"
          plutil -replace NSLocalNetworkUsageDescription -string "我们需要访问本地网络以获取歌词和元数据。" "$INFO_PLIST"
          plutil -replace NSAppleMusicUsageDescription -string "我们需要访问您的媒体库以播放本地音乐。" "$INFO_PLIST"
          
          echo "📊 Final Payload size: $(du -sh Payload | cut -f1)"
          zip -q -r NewPlayer.ipa Payload
          
          echo "✅ Done! IPA Created."

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NewPlayer-v1.3.0-IPA
          path: NewPlayer.ipa

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v1.3.0-newplayer-${{ github.run_number }}"
          name: "New Player Release #${{ github.run_number }}"
          files: NewPlayer.ipa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
