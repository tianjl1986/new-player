name: New Player Build

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode 16
        run: sudo xcode-select -s /Applications/Xcode_16.4.app

      - name: Build and Package
        run: |
          set -e
          
          echo "🚀 Preparing project structure..."
          # 获取原始文件夹名
          ORIGINAL_FOLDER=$(basename $(pwd))
          
          # 重命名为 .swiftpm 以触发正确的构建逻辑
          cd ..
          mv "$ORIGINAL_FOLDER" NewPlayer.swiftpm
          cd NewPlayer.swiftpm
          
          echo "🚀 Building NewPlayer.swiftpm..."
          /Applications/Xcode_16.4.app/Contents/Developer/usr/bin/xcodebuild archive \
            -scheme "NewPlayer" \
            -destination "generic/platform=iOS" \
            -archivePath ./NewPlayer.xcarchive \
            -derivedDataPath ./DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            SKIP_INSTALL=NO
          
          echo "📦 Assembling Bundle..."
          APP_BUNDLE=$(find ./DerivedData -name "*.app" -type d | grep "InstallationBuildProductsLocation" | head -n 1)
          
          if [ -n "$APP_BUNDLE" ]; then
            echo "✅ Found Compiled App Bundle: $APP_BUNDLE"
            mkdir -p Payload
            cp -R "$APP_BUNDLE" Payload/
          else
            echo "⚠️ Compiled bundle not found in DerivedData, checking xcarchive..."
            APP_BUNDLE=$(find ./NewPlayer.xcarchive/Products/Applications -name "*.app" -type d | head -n 1)
            if [ -n "$APP_BUNDLE" ]; then
                echo "✅ Found in xcarchive: $APP_BUNDLE"
                mkdir -p Payload
                cp -R "$APP_BUNDLE" Payload/
            else
                echo "❌ ERROR: Cannot find .app anywhere!"
                exit 1
            fi
          fi
          
          # 📝 生成 Info.plist
          cat << 'EOF' > Payload/*.app/Info.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleExecutable</key><string>NewPlayer</string>
              <key>CFBundleIdentifier</key><string>com.skeuo.newplayer</string>
              <key>CFBundleName</key><string>NewPlayer</string>
              <key>CFBundlePackageType</key><string>APPL</string>
              <key>CFBundleShortVersionString</key><string>1.0.0</string>
              <key>CFBundleVersion</key><string>1</string>
              <key>LSRequiresIPhoneOS</key><true/>
              <key>UILaunchScreen</key><dict/>
              <key>MinimumOSVersion</key><string>16.0</string>
              <key>UIDeviceFamily</key><array><integer>1</integer></array>
              <key>NSAppleMusicUsageDescription</key>
              <string>我们需要访问您的媒体库以播放本地音乐。</string>
              <key>NSPhotoLibraryUsageDescription</key>
              <string>我们需要访问相册以保存或读取封面图片。</string>
              <key>NSLocalNetworkUsageDescription</key>
              <string>我们需要访问本地网络以获取歌词和元数据。</string>
              <key>UIBackgroundModes</key><array><string>audio</string></array>
              <key>UISupportedInterfaceOrientations</key><array><string>UIInterfaceOrientationPortrait</string></array>
          </dict>
          </plist>
          EOF
          
          echo "📊 Final Payload size: $(du -sh Payload | cut -f1)"
          zip -q -r NewPlayer.ipa Payload
          
          cd ..
          mv NewPlayer.swiftpm "$ORIGINAL_FOLDER"
          echo "✅ Done! IPA Created."

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NewPlayer-IPA
          path: NewPlayer.ipa

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v1.0.0-${{ github.run_number }}"
          name: "New Player Release #${{ github.run_number }}"
          files: NewPlayer.ipa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
